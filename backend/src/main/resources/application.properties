spring.application.name=personal-assistant-backend

# Port (override with the PORT environment variable)
server.port=${PORT:8080}

# Persistent file-based H2 database.
# Files are created in a "data" folder next to where you start the app (e.g. backend\data).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/personal-assistant-db}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create/update tables automatically from the entity classes (data is kept between restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console for local development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Accept "high", "High" or "HIGH" for enum values in JSON
spring.jackson.mapper.accept-case-insensitive-enums=true

# Browser origins allowed to call the API (comma-separated).
# Override with the APP_CORS_ALLOWED_ORIGINS environment variable.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:4200}

# Working hours used when looking for free time slots
app.schedule.day-start=08:00
app.schedule.day-end=20:00
# Step (in minutes) between suggested start times
app.schedule.slot-step-minutes=30
